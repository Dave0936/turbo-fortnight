<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Malt whiskies on the shelves behind the bar">
  <defs>
    <linearGradient id="kBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2820"/><stop offset="100%" stop-color="#4a4032"/>
    </linearGradient>
    <linearGradient id="kShelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d5233"/><stop offset="100%" stop-color="#4a3722"/>
    </linearGradient>
    <linearGradient id="kDram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a94b"/><stop offset="100%" stop-color="#a8641f"/>
    </linearGradient>
    <radialGradient id="kGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffcf85" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffcf85" stop-opacity="0"/>
    </radialGradient>
    <filter id="kBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#kBack)"/>
  <ellipse cx="600" cy="380" rx="620" ry="420" fill="url(#kGlow)"/>

  <!-- Back-bar shelving -->
