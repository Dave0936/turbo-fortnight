  <!-- Bar counter -->
  <rect x="0" y="640" width="1200" height="30" fill="#7a5c39"/>
  <rect x="0" y="670" width="1200" height="230" fill="#5a4227"/>
  <g opacity="0.25" stroke="#3a2a18" stroke-width="2"><path d="M0 706 H1200 M0 756 H1200 M0 812 H1200"/></g>
  <rect x="0" y="640" width="1200" height="8" fill="#a07d4d" opacity="0.7"/>

  <!-- Two drams and a water jug on the counter -->
  <g transform="translate(430 566)">
    <path d="M-34 0 h68 l-8 74 h-52 Z" fill="#e9eeea" opacity="0.35"/>
    <path d="M-28 30 h56 l-6 42 h-44 Z" fill="url(#kDram)"/>
    <ellipse cx="0" cy="74" rx="34" ry="8" fill="#2f2418" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="34" ry="9" fill="#f2f6f2" opacity="0.4"/>
