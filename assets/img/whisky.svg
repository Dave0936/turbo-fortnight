      <rect x="60" y="346" width="1080" height="10"/>
      <rect x="60" y="556" width="1080" height="10"/>
    </g>
    <!-- Backlight strips -->
    <g fill="#ffcf85" opacity="0.16" filter="url(#kBlur)">
      <rect x="80" y="140" width="1040" height="60"/>
      <rect x="80" y="350" width="1040" height="60"/>
      <rect x="80" y="560" width="1040" height="60"/>
    </g>
  </g>

