<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The Octagonal Restaurant, with its ornate ceiling and three tall windows looking down Strathconon">
  <defs>
    <linearGradient id="oWallFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e7d4"/><stop offset="100%" stop-color="#ddd0b6"/>
    </linearGradient>
    <linearGradient id="oWallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9bb9e"/><stop offset="100%" stop-color="#e6dbc4"/>
    </linearGradient>
    <linearGradient id="oWallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#c9bb9e"/><stop offset="100%" stop-color="#e6dbc4"/>
    </linearGradient>
    <linearGradient id="oCeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfc2a6"/><stop offset="100%" stop-color="#f2ead8"/>
    </linearGradient>
    <linearGradient id="oFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6743"/><stop offset="100%" stop-color="#5e4429"/>
    </linearGradient>
    <linearGradient id="oView" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#bcd3dd"/>
      <stop offset="38%" stop-color="#dfe2cf"/>
      <stop offset="58%" stop-color="#8ca089"/>
      <stop offset="100%" stop-color="#5c7355"/>
    </linearGradient>
    <radialGradient id="oGlow" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#ffe4b4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe4b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oCloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/><stop offset="100%" stop-color="#e3dac6"/>
    </linearGradient>
    <filter id="oSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="oSoftS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1200" height="900" fill="#e6dbc4"/>

  <!-- ================= Ceiling ================= -->
  <path fill="url(#oCeil)" d="M0 0 H1200 V50 L990 140 L770 210 H430 L210 140 L0 50 Z"/>

  <!-- Coffered ribs radiating to the octagon's centre -->
  <g stroke="#b9a883" stroke-width="2.5" opacity="0.75" fill="none">
    <path d="M0 50 L270 95 M210 140 L385 144 M430 210 L506 183 M770 210 L694 183 M990 140 L815 144 M1200 50 L930 95"/>
  </g>
  <!-- Inner octagonal ring -->
  <path fill="none" stroke="#b08d57" stroke-width="4" opacity="0.85"
        d="M270 95 L385 144 L506 183 H694 L815 144 L930 95"/>
  <path fill="none" stroke="#cbbb96" stroke-width="2" opacity="0.7"
        d="M292 88 L396 133 L516 172 H684 L804 133 L908 88"/>

  <!-- Ornate ceiling rose -->
  <g transform="translate(600 122)">
    <g fill="none" stroke="#b08d57" stroke-width="2.5" opacity="0.9">
      <ellipse cx="0" cy="0" rx="96" ry="34"/>
      <ellipse cx="0" cy="0" rx="66" ry="23"/>
      <ellipse cx="0" cy="0" rx="34" ry="12"/>
    </g>
    <g fill="#d8c8a4" opacity="0.85">
      <ellipse cx="-78" cy="0" rx="15" ry="6"/><ellipse cx="78" cy="0" rx="15" ry="6"/>
      <ellipse cx="-46" cy="-16" rx="13" ry="5"/><ellipse cx="46" cy="-16" rx="13" ry="5"/>
      <ellipse cx="-46" cy="16" rx="13" ry="5"/><ellipse cx="46" cy="16" rx="13" ry="5"/>
      <ellipse cx="0" cy="-20" rx="13" ry="5"/><ellipse cx="0" cy="20" rx="13" ry="5"/>
    </g>
  </g>

  <!-- ================= Walls ================= -->
  <!-- Side walls -->
  <path fill="url(#oWallL)" d="M0 50 L210 140 L210 700 L0 790 Z"/>
  <path fill="url(#oWallR)" d="M1200 50 L990 140 L990 700 L1200 790 Z"/>
  <!-- Angled octagon facets -->
  <path fill="#e8ddc6" d="M210 140 L430 210 L430 620 L210 700 Z"/>
  <path fill="#e8ddc6" d="M990 140 L770 210 L770 620 L990 700 Z"/>
  <!-- Far facet -->
  <path fill="url(#oWallFar)" d="M430 210 H770 V620 H430 Z"/>

  <!-- Cornice following the octagon -->
  <g fill="none" stroke="#c2ae86" stroke-width="7" opacity="0.9">
    <path d="M0 50 L210 140 L430 210 H770 L990 140 L1200 50"/>
  </g>
  <g fill="none" stroke="#b08d57" stroke-width="2.5" opacity="0.7">
    <path d="M0 68 L210 156 L430 224 H770 L990 156 L1200 68"/>
  </g>
  <!-- Skirting -->
  <g fill="none" stroke="#c2ae86" stroke-width="6" opacity="0.8">
    <path d="M0 790 L210 700 L430 620 H770 L990 700 L1200 790"/>
  </g>

  <!-- ================= Three ceiling-to-floor windows ================= -->
  <g>
    <!-- Window 1 -->
    <g transform="translate(445 244)">
      <rect x="-8" y="-8" width="101" height="374" fill="#f6efdd"/>
      <rect x="0" y="0" width="85" height="358" fill="url(#oView)"/>
      <path d="M0 196 q22 -26 44 -8 q22 -22 41 -6 L85 358 L0 358Z" fill="#6d8566" opacity="0.85"/>
      <path d="M0 150 L20 128 L34 150 L48 120 L66 150 L85 132 L85 168 L0 168Z" fill="#93a2a0" opacity="0.6"/>
      <g stroke="#fbf6e8" stroke-width="4.5" fill="none">
        <path d="M42.5 0 V358 M0 90 H85 M0 180 H85 M0 268 H85"/><rect x="0" y="0" width="85" height="358"/>
      </g>
    </g>
    <!-- Window 2 -->
    <g transform="translate(556 244)">
      <rect x="-8" y="-8" width="101" height="374" fill="#f6efdd"/>
      <rect x="0" y="0" width="85" height="358" fill="url(#oView)"/>
      <path d="M0 196 q24 -30 46 -10 q20 -20 39 -4 L85 358 L0 358Z" fill="#6d8566" opacity="0.85"/>
      <path d="M0 146 L18 122 L32 148 L50 116 L68 148 L85 130 L85 168 L0 168Z" fill="#93a2a0" opacity="0.6"/>
      <g stroke="#fbf6e8" stroke-width="4.5" fill="none">
        <path d="M42.5 0 V358 M0 90 H85 M0 180 H85 M0 268 H85"/><rect x="0" y="0" width="85" height="358"/>
      </g>
    </g>
    <!-- Window 3 -->
    <g transform="translate(667 244)">
      <rect x="-8" y="-8" width="101" height="374" fill="#f6efdd"/>
      <rect x="0" y="0" width="85" height="358" fill="url(#oView)"/>
      <path d="M0 196 q22 -26 44 -8 q22 -22 41 -6 L85 358 L0 358Z" fill="#6d8566" opacity="0.85"/>
      <path d="M0 150 L22 126 L36 150 L52 118 L68 150 L85 134 L85 168 L0 168Z" fill="#93a2a0" opacity="0.6"/>
      <g stroke="#fbf6e8" stroke-width="4.5" fill="none">
        <path d="M42.5 0 V358 M0 90 H85 M0 180 H85 M0 268 H85"/><rect x="0" y="0" width="85" height="358"/>
      </g>
    </g>
    <!-- Daylight spilling in -->
    <path d="M430 244 H770 L900 900 H300 Z" fill="#fff6df" opacity="0.28" filter="url(#oSoft)"/>
  </g>

  <!-- Swagged curtains between the windows -->
  <g fill="#4a5f4c" opacity="0.92">
    <path d="M424 226 h30 q-16 200 -4 394 h-26 Z"/>
    <path d="M776 226 h-30 q16 200 4 394 h26 Z"/>
  </g>
  <path d="M430 226 q85 34 170 0 q85 34 170 0 v-22 H430 Z" fill="#4a5f4c" opacity="0.9"/>
  <path d="M430 226 q85 34 170 0 q85 34 170 0" fill="none" stroke="#b08d57" stroke-width="2.5" opacity="0.7"/>

  <!-- ================= Fireplace on the left facet ================= -->
  <g>
    <path fill="#cfc2a3" d="M376 424 L262 430 L262 682 L376 646 Z"/>
    <path fill="#efe8d6" d="M382 418 L256 425 L256 438 L382 432 Z"/>
    <path fill="#2a2118" d="M356 468 L286 472 L286 660 L356 634 Z"/>
    <!-- Firelight -->
    <ellipse cx="320" cy="596" rx="150" ry="120" fill="#ffab52" opacity="0.3" filter="url(#oSoft)"/>
    <g filter="url(#oSoftS)">
      <path d="M322 540 c26 40 34 58 24 82 c-8 18 -20 22 -26 22 c-6 0 -18 -6 -24 -22 c-10 -26 0 -42 26 -82Z" fill="#ffbb5f"/>
      <path d="M300 574 c14 24 18 34 12 48 c-5 11 -12 13 -16 13 c-4 0 -11 -3 -14 -13 c-6 -15 2 -25 18 -48Z" fill="#ffd68a" opacity="0.9"/>
    </g>
    <g fill="#3a2b1e">
      <rect x="288" y="628" width="62" height="12" rx="4"/>
      <rect x="292" y="612" width="54" height="11" rx="4" transform="rotate(-5 319 617)"/>
    </g>
    <!-- Mantel candlesticks -->
    <g>
      <g transform="translate(292 400)">
        <rect x="-5" y="0" width="10" height="30" fill="#efe6cf"/>
        <path d="M0 -14 c8 9 5 14 0 14 c-5 0 -8 -5 0 -14Z" fill="#ffcf7a"/>
        <ellipse cx="0" cy="-2" rx="26" ry="34" fill="#ffcf7a" opacity="0.3" filter="url(#oSoftS)"/>
      </g>
      <g transform="translate(350 398)">
        <rect x="-5" y="0" width="10" height="30" fill="#efe6cf"/>
        <path d="M0 -14 c8 9 5 14 0 14 c-5 0 -8 -5 0 -14Z" fill="#ffcf7a"/>
        <ellipse cx="0" cy="-2" rx="26" ry="34" fill="#ffcf7a" opacity="0.3" filter="url(#oSoftS)"/>
      </g>
    </g>
  </g>

  <!-- Gilt mirror on the right facet -->
  <g>
    <path fill="#a8853f" d="M816 300 L946 268 L946 470 L816 450 Z"/>
    <path fill="#cdd3ca" d="M830 316 L932 291 L932 452 L830 434 Z"/>
    <path fill="#dde1d6" opacity="0.6" d="M830 316 L932 291 L932 340 L830 372 Z"/>
  </g>

  <!-- ================= Floor ================= -->
  <path fill="url(#oFloor)" d="M0 790 L210 700 L430 620 H770 L990 700 L1200 790 V900 H0 Z"/>
  <g opacity="0.18" stroke="#3f2d19" stroke-width="2" fill="none">
    <path d="M0 820 H1200 M0 856 H1200"/>
    <path d="M430 620 L360 900 M520 620 L500 900 M610 620 L620 900 M700 620 L740 900 M770 620 L880 900"/>
  </g>
  <!-- Rug -->
  <path fill="#6b4a4a" opacity="0.55" d="M250 760 H950 L1060 900 H140 Z"/>
  <path fill="none" stroke="#c2a06a" stroke-width="3" opacity="0.5" d="M290 782 H910 L1000 890 H200 Z"/>

  <!-- ================= Chandelier ================= -->
  <g>
    <rect x="598" y="140" width="4" height="86" fill="#8f6f3e"/>
    <ellipse cx="600" cy="236" rx="86" ry="20" fill="none" stroke="#b08d57" stroke-width="4"/>
    <ellipse cx="600" cy="212" rx="52" ry="13" fill="none" stroke="#b08d57" stroke-width="3"/>
    <g fill="#f4ead2">
      <rect x="518" y="216" width="6" height="24"/><rect x="562" y="224" width="6" height="26"/>
      <rect x="632" y="224" width="6" height="26"/><rect x="676" y="216" width="6" height="24"/>
      <rect x="596" y="196" width="6" height="22"/>
    </g>
    <g fill="#ffcf7a">
      <path d="M521 206 c7 8 4 12 0 12 c-4 0 -7 -4 0 -12Z"/><path d="M565 214 c7 8 4 12 0 12 c-4 0 -7 -4 0 -12Z"/>
      <path d="M635 214 c7 8 4 12 0 12 c-4 0 -7 -4 0 -12Z"/><path d="M679 206 c7 8 4 12 0 12 c-4 0 -7 -4 0 -12Z"/>
      <path d="M599 186 c7 8 4 12 0 12 c-4 0 -7 -4 0 -12Z"/>
    </g>
    <ellipse cx="600" cy="216" rx="170" ry="90" fill="url(#oGlow)"/>
    <!-- Drops -->
    <g fill="#e8eef0" opacity="0.55">
      <path d="M600 246 l7 16 -7 12 -7 -12Z"/><path d="M552 244 l6 13 -6 10 -6 -10Z"/>
      <path d="M648 244 l6 13 -6 10 -6 -10Z"/><path d="M516 238 l5 11 -5 9 -5 -9Z"/>
      <path d="M684 238 l5 11 -5 9 -5 -9Z"/>
    </g>
  </g>

  <!-- ================= Tables ================= -->
  <!-- Far table -->
  <g transform="translate(600 640)">
    <ellipse cx="0" cy="0" rx="96" ry="26" fill="url(#oCloth)"/>
    <path d="M-96 0 q6 62 14 96 h164 q8 -34 14 -96 Z" fill="url(#oCloth)"/>
    <g transform="translate(0 -34)">
      <rect x="-4" y="0" width="8" height="34" fill="#f4ead2"/>
      <path d="M0 -14 c8 9 5 14 0 14 c-5 0 -8 -5 0 -14Z" fill="#ffcf7a"/>
      <ellipse cx="0" cy="-2" rx="30" ry="38" fill="#ffcf7a" opacity="0.35" filter="url(#oSoftS)"/>
    </g>
    <g fill="#f7f2e6">
      <ellipse cx="-46" cy="4" rx="24" ry="8"/><ellipse cx="46" cy="4" rx="24" ry="8"/>
    </g>
    <g fill="#8e2f3c" opacity="0.85">
      <path d="M-64 -6 h12 l-2 14 h-8 Z"/><path d="M64 -6 h-12 l2 14 h8 Z"/>
    </g>
  </g>

  <!-- Near tables -->
  <g transform="translate(250 810)">
    <ellipse cx="0" cy="0" rx="140" ry="38" fill="url(#oCloth)"/>
    <path d="M-140 0 q10 60 20 90 h240 q10 -30 20 -90 Z" fill="url(#oCloth)"/>
    <g transform="translate(0 -48)">
      <rect x="-6" y="0" width="12" height="48" fill="#f4ead2"/>
      <path d="M0 -20 c11 13 7 20 0 20 c-7 0 -11 -7 0 -20Z" fill="#ffcf7a"/>
      <ellipse cx="0" cy="-4" rx="42" ry="54" fill="#ffcf7a" opacity="0.38" filter="url(#oSoftS)"/>
    </g>
    <g fill="#f7f2e6">
      <ellipse cx="-68" cy="8" rx="34" ry="11"/><ellipse cx="68" cy="8" rx="34" ry="11"/>
    </g>
    <g fill="#e9eee9" opacity="0.7">
      <path d="M-96 -12 h18 l-3 22 h-12 Z"/><path d="M96 -12 h-18 l3 22 h12 Z"/>
    </g>
  </g>

  <g transform="translate(970 800)">
    <ellipse cx="0" cy="0" rx="132" ry="36" fill="url(#oCloth)"/>
    <path d="M-132 0 q10 58 20 100 h224 q10 -42 20 -100 Z" fill="url(#oCloth)"/>
    <g transform="translate(0 -44)">
      <rect x="-6" y="0" width="12" height="44" fill="#f4ead2"/>
      <path d="M0 -18 c10 12 6 18 0 18 c-6 0 -10 -6 0 -18Z" fill="#ffcf7a"/>
      <ellipse cx="0" cy="-4" rx="40" ry="50" fill="#ffcf7a" opacity="0.38" filter="url(#oSoftS)"/>
    </g>
    <g fill="#f7f2e6">
      <ellipse cx="-64" cy="8" rx="32" ry="10"/><ellipse cx="64" cy="8" rx="32" ry="10"/>
    </g>
  </g>

  <!-- Chairs -->
  <g fill="#4a5f4c">
    <g transform="translate(474 636)"><rect x="-30" y="-56" width="60" height="76" rx="8"/><rect x="-22" y="-46" width="44" height="56" rx="6" fill="#5d7360"/></g>
    <g transform="translate(726 636)"><rect x="-30" y="-56" width="60" height="76" rx="8"/><rect x="-22" y="-46" width="44" height="56" rx="6" fill="#5d7360"/></g>
    <g transform="translate(60 806)"><rect x="-42" y="-78" width="84" height="106" rx="10"/><rect x="-31" y="-64" width="62" height="78" rx="8" fill="#5d7360"/></g>
    <g transform="translate(440 800)"><rect x="-42" y="-78" width="84" height="106" rx="10"/><rect x="-31" y="-64" width="62" height="78" rx="8" fill="#5d7360"/></g>
  </g>
</svg>
