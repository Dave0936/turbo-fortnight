<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A waterfall falling through birch and pine woodland">
  <defs>
    <linearGradient id="fBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93a68b"/><stop offset="45%" stop-color="#5f7359"/><stop offset="100%" stop-color="#3a4a38"/>
    </linearGradient>
    <linearGradient id="fRock" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#6b6a5e"/><stop offset="100%" stop-color="#3f3f38"/>
    </linearGradient>
    <linearGradient id="fWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f6f2" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#dfe7e2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c7d4cd" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="fPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ea69a"/><stop offset="100%" stop-color="#3d5148"/>
    </linearGradient>
    <filter id="fBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="fBlurS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#fBack)"/>

  <!-- Light filtering through the canopy -->
  <g opacity="0.3" fill="#e8efd8" filter="url(#fBlur)">
    <path d="M280 -40 L520 -40 L360 460 L200 460Z"/>
    <path d="M820 -40 L1000 -40 L900 420 L740 420Z"/>
  </g>

  <!-- Distant trees -->
  <g fill="#43563d" opacity="0.75">
    <ellipse cx="120" cy="240" rx="150" ry="200"/><ellipse cx="1080" cy="220" rx="160" ry="210"/>
    <ellipse cx="330" cy="170" rx="120" ry="160"/><ellipse cx="880" cy="150" rx="130" ry="170"/>
  </g>

  <!-- Rock walls -->
  <path fill="url(#fRock)" d="M0 320 L180 300 300 380 340 520 300 700 200 820 0 900Z"/>
  <path fill="url(#fRock)" d="M1200 300 L1020 290 900 370 860 520 900 700 1010 820 1200 900Z"/>
  <g fill="#565549" opacity="0.6">
    <path d="M300 380 L360 420 330 520 300 480Z"/>
    <path d="M900 370 L840 412 872 520 900 476Z"/>
  </g>

  <!-- Ledges -->
  <g fill="#514f45">
    <path d="M330 300 h240 l30 40 h-300Z"/>
    <path d="M640 300 h240 l30 40 h-300Z"/>
    <path d="M360 540 h180 l40 44 h-260Z"/>
    <path d="M660 540 h180 l40 44 h-260Z"/>
  </g>

  <!-- The falls -->
  <g>
    <path fill="url(#fWater)" d="M470 300 h270 q22 130 6 244 q-14 120 -30 190 h-230 q-18 -108 -28 -212 q-10 -112 12 -222Z"/>
    <g fill="#ffffff" opacity="0.55">
      <path d="M520 306 q-14 210 4 424 h20 q-20 -216 -6 -424Z"/>
      <path d="M600 302 q-8 214 6 428 h22 q-18 -216 -6 -428Z"/>
      <path d="M680 306 q6 208 -6 424 h22 q14 -216 4 -424Z"/>
    </g>
    <!-- Secondary fall over the lower ledge -->
    <path fill="url(#fWater)" opacity="0.9" d="M430 560 h340 q10 90 -4 160 h-330 q-16 -80 -6 -160Z"/>
  </g>

  <!-- Spray -->
  <g fill="#f2f5ef" opacity="0.55" filter="url(#fBlur)">
    <ellipse cx="600" cy="740" rx="260" ry="70"/>
    <ellipse cx="600" cy="580" rx="200" ry="40"/>
  </g>

  <!-- Plunge pool -->
  <path fill="url(#fPool)" d="M0 780 C200 742, 400 764, 600 762 C800 760, 1000 742, 1200 776 L1200 900 L0 900Z"/>
  <g opacity="0.4" fill="#e6efe8">
    <rect x="380" y="812" width="440" height="4" rx="2"/>
    <rect x="300" y="838" width="600" height="4" rx="2"/>
    <rect x="420" y="864" width="380" height="4" rx="2"/>
    <rect x="240" y="884" width="720" height="4" rx="2"/>
  </g>

  <!-- Foreground boulders -->
  <g fill="#3b3b33">
    <ellipse cx="120" cy="856" rx="170" ry="70"/>
    <ellipse cx="1090" cy="846" rx="180" ry="74"/>
  </g>
  <g fill="#4d4c42" opacity="0.7">
    <ellipse cx="96" cy="836" rx="120" ry="44"/><ellipse cx="1108" cy="826" rx="126" ry="46"/>
  </g>
  <g fill="#5c6b3f" opacity="0.6">
    <ellipse cx="60" cy="810" rx="70" ry="20"/><ellipse cx="1150" cy="800" rx="66" ry="20"/>
  </g>

  <!-- Overhanging birch branches -->
  <g stroke="#4a4033" fill="none" stroke-linecap="round">
    <path d="M0 60 C140 100, 250 60, 360 130" stroke-width="12"/>
    <path d="M1200 40 C1060 90, 960 50, 850 120" stroke-width="12"/>
  </g>
  <g fill="#6f8a4f" opacity="0.9">
    <ellipse cx="90" cy="86" rx="46" ry="24" transform="rotate(-16 90 86)"/>
    <ellipse cx="200" cy="84" rx="44" ry="22" transform="rotate(10 200 84)"/>
    <ellipse cx="310" cy="112" rx="42" ry="22" transform="rotate(-8 310 112)"/>
    <ellipse cx="1110" cy="72" rx="46" ry="24" transform="rotate(14 1110 72)"/>
    <ellipse cx="1000" cy="74" rx="44" ry="22" transform="rotate(-10 1000 74)"/>
    <ellipse cx="890" cy="106" rx="42" ry="22" transform="rotate(8 890 106)"/>
  </g>
  <g fill="#87a15e" opacity="0.7">
    <ellipse cx="150" cy="60" rx="34" ry="18"/><ellipse cx="1060" cy="50" rx="34" ry="18"/>
    <ellipse cx="260" cy="60" rx="30" ry="16"/><ellipse cx="945" cy="56" rx="30" ry="16"/>
  </g>
</svg>
