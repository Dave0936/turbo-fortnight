<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A floral arch and festoon lights on the lawn at dusk">
  <defs>
    <linearGradient id="wSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4a5e"/><stop offset="45%" stop-color="#7d7c81"/>
      <stop offset="75%" stop-color="#d3a887"/><stop offset="100%" stop-color="#efcfa4"/>
    </linearGradient>
    <linearGradient id="wLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44563c"/><stop offset="100%" stop-color="#2b3826"/>
    </linearGradient>
    <radialGradient id="wBulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe6b0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe6b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="wBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#wSky)"/>
  <g opacity="0.35" fill="#e6d3bb" filter="url(#wBlur)">
    <ellipse cx="300" cy="180" rx="260" ry="30"/><ellipse cx="920" cy="240" rx="230" ry="24"/>
  </g>
  <circle cx="880" cy="330" r="26" fill="#ffeec9" opacity="0.7" filter="url(#wBlur)"/>

  <!-- Hills -->
  <path fill="#5c6a63" opacity="0.7" d="M0 470 L160 424 320 462 480 414 640 458 800 420 960 460 1120 424 1200 452 1200 900 0 900Z"/>
  <path fill="#3d4c40" d="M0 540 L180 506 360 542 540 502 720 540 900 504 1080 542 1200 520 1200 900 0 900Z"/>

  <!-- Treeline -->
  <g fill="#2b3826" opacity="0.9">
    <ellipse cx="120" cy="510" rx="120" ry="86"/><ellipse cx="250" cy="536" rx="96" ry="66"/>
    <ellipse cx="1080" cy="504" rx="130" ry="92"/><ellipse cx="950" cy="540" rx="94" ry="64"/>
  </g>

  <!-- Lawn -->
  <path fill="url(#wLawn)" d="M0 580 C300 552, 900 552, 1200 580 L1200 900 L0 900Z"/>

  <!-- Festoon lights, two swags -->
  <g>
    <path d="M40 300 Q600 470 1160 300" fill="none" stroke="#2b3226" stroke-width="3" opacity="0.8"/>
    <path d="M40 380 Q600 546 1160 380" fill="none" stroke="#2b3226" stroke-width="3" opacity="0.8"/>
    <g>
      <!-- Bulbs on the upper swag -->
      <g>
        <circle cx="152" cy="336" r="6" fill="#ffe6b0"/><circle cx="152" cy="336" r="24" fill="url(#wBulb)"/>
        <circle cx="264" cy="368" r="6" fill="#ffe6b0"/><circle cx="264" cy="368" r="24" fill="url(#wBulb)"/>
        <circle cx="376" cy="394" r="6" fill="#ffe6b0"/><circle cx="376" cy="394" r="24" fill="url(#wBulb)"/>
        <circle cx="488" cy="412" r="6" fill="#ffe6b0"/><circle cx="488" cy="412" r="24" fill="url(#wBulb)"/>
        <circle cx="600" cy="418" r="6" fill="#ffe6b0"/><circle cx="600" cy="418" r="26" fill="url(#wBulb)"/>
        <circle cx="712" cy="412" r="6" fill="#ffe6b0"/><circle cx="712" cy="412" r="24" fill="url(#wBulb)"/>
        <circle cx="824" cy="394" r="6" fill="#ffe6b0"/><circle cx="824" cy="394" r="24" fill="url(#wBulb)"/>
        <circle cx="936" cy="368" r="6" fill="#ffe6b0"/><circle cx="936" cy="368" r="24" fill="url(#wBulb)"/>
        <circle cx="1048" cy="336" r="6" fill="#ffe6b0"/><circle cx="1048" cy="336" r="24" fill="url(#wBulb)"/>
      </g>
      <g opacity="0.85">
        <circle cx="180" cy="410" r="5" fill="#ffe6b0"/><circle cx="180" cy="410" r="20" fill="url(#wBulb)"/>
        <circle cx="320" cy="452" r="5" fill="#ffe6b0"/><circle cx="320" cy="452" r="20" fill="url(#wBulb)"/>
        <circle cx="460" cy="482" r="5" fill="#ffe6b0"/><circle cx="460" cy="482" r="20" fill="url(#wBulb)"/>
        <circle cx="600" cy="494" r="5" fill="#ffe6b0"/><circle cx="600" cy="494" r="20" fill="url(#wBulb)"/>
        <circle cx="740" cy="482" r="5" fill="#ffe6b0"/><circle cx="740" cy="482" r="20" fill="url(#wBulb)"/>
        <circle cx="880" cy="452" r="5" fill="#ffe6b0"/><circle cx="880" cy="452" r="20" fill="url(#wBulb)"/>
        <circle cx="1020" cy="410" r="5" fill="#ffe6b0"/><circle cx="1020" cy="410" r="20" fill="url(#wBulb)"/>
      </g>
    </g>
  </g>

  <!-- Floral arch -->
  <g transform="translate(600 0)">
    <path d="M-190 780 L-190 470 A190 190 0 0 1 190 470 L190 780" fill="none" stroke="#6a5138" stroke-width="14"/>
    <!-- Foliage along the arch -->
    <g fill="#4c6446">
      <ellipse cx="-190" cy="700" rx="26" ry="34"/><ellipse cx="-186" cy="632" rx="30" ry="30"/>
      <ellipse cx="-180" cy="566" rx="26" ry="30"/><ellipse cx="-160" cy="506" rx="30" ry="28"/>
      <ellipse cx="-120" cy="446" rx="32" ry="28"/><ellipse cx="-64" cy="400" rx="32" ry="26"/>
      <ellipse cx="0" cy="382" rx="34" ry="26"/><ellipse cx="64" cy="400" rx="32" ry="26"/>
      <ellipse cx="120" cy="446" rx="32" ry="28"/><ellipse cx="160" cy="506" rx="30" ry="28"/>
      <ellipse cx="180" cy="566" rx="26" ry="30"/><ellipse cx="186" cy="632" rx="30" ry="30"/>
      <ellipse cx="190" cy="700" rx="26" ry="34"/>
    </g>
    <g fill="#5d7657" opacity="0.8">
      <ellipse cx="-172" cy="668" rx="20" ry="24"/><ellipse cx="-146" cy="536" rx="22" ry="22"/>
      <ellipse cx="-92" cy="416" rx="24" ry="20"/><ellipse cx="34" cy="386" rx="24" ry="20"/>
      <ellipse cx="146" cy="470" rx="22" ry="22"/><ellipse cx="176" cy="660" rx="20" ry="24"/>
    </g>
    <!-- Blooms: cream roses and heather -->
    <g fill="#f6ead6">
      <circle cx="-186" cy="678" r="13"/><circle cx="-178" cy="588" r="11"/><circle cx="-142" cy="486" r="13"/>
      <circle cx="-74" cy="410" r="12"/><circle cx="10" cy="378" r="14"/><circle cx="86" cy="414" r="12"/>
      <circle cx="150" cy="488" r="13"/><circle cx="182" cy="596" r="11"/><circle cx="188" cy="688" r="13"/>
    </g>
    <g fill="#8a6f92" opacity="0.9">
      <circle cx="-160" cy="628" r="8"/><circle cx="-118" cy="452" r="8"/><circle cx="-30" cy="392" r="8"/>
      <circle cx="56" cy="396" r="8"/><circle cx="132" cy="524" r="8"/><circle cx="170" cy="640" r="8"/>
    </g>
    <g fill="#c9a86a" opacity="0.75">
      <circle cx="-196" cy="720" r="7"/><circle cx="-100" cy="432" r="6"/><circle cx="40" cy="404" r="6"/>
      <circle cx="114" cy="462" r="6"/><circle cx="196" cy="726" r="7"/>
    </g>
  </g>

  <!-- Aisle -->
  <path d="M470 900 C500 800, 552 754, 600 754 C648 754, 700 800, 730 900Z" fill="#d8ccb4" opacity="0.55"/>

  <!-- Lanterns lining the aisle -->
  <g fill="#3a3226">
    <g transform="translate(452 792)">
      <rect x="-16" y="0" width="32" height="42" rx="3"/>
      <rect x="-12" y="4" width="24" height="34" fill="#ffdc9e"/>
      <circle cx="0" cy="20" r="34" fill="url(#wBulb)" opacity="0.7"/>
    </g>
    <g transform="translate(748 792)">
      <rect x="-16" y="0" width="32" height="42" rx="3"/>
      <rect x="-12" y="4" width="24" height="34" fill="#ffdc9e"/>
      <circle cx="0" cy="20" r="34" fill="url(#wBulb)" opacity="0.7"/>
    </g>
    <g transform="translate(492 726) scale(0.8)">
      <rect x="-16" y="0" width="32" height="42" rx="3"/>
      <rect x="-12" y="4" width="24" height="34" fill="#ffdc9e"/>
      <circle cx="0" cy="20" r="34" fill="url(#wBulb)" opacity="0.6"/>
    </g>
    <g transform="translate(708 726) scale(0.8)">
      <rect x="-16" y="0" width="32" height="42" rx="3"/>
      <rect x="-12" y="4" width="24" height="34" fill="#ffdc9e"/>
      <circle cx="0" cy="20" r="34" fill="url(#wBulb)" opacity="0.6"/>
    </g>
  </g>
</svg>
