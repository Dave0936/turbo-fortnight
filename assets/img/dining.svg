<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A candlelit table laid for dinner in the restaurant">
  <defs>
    <linearGradient id="dWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/><stop offset="100%" stop-color="#5a4f3c"/>
    </linearGradient>
    <radialGradient id="dGlow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#ffdca6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffdca6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dCloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf1"/><stop offset="100%" stop-color="#ddd5c2"/>
    </linearGradient>
    <linearGradient id="dWine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e2f3c"/><stop offset="100%" stop-color="#5c1c26"/>
    </linearGradient>
    <filter id="dBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="dBlurS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#dWall)"/>
  <rect width="1200" height="900" fill="url(#dGlow)"/>

  <!-- Panelled wall -->
  <g fill="none" stroke="#6d6049" stroke-width="4" opacity="0.55">
    <rect x="60" y="90" width="200" height="330" rx="4"/>
    <rect x="300" y="90" width="200" height="330" rx="4"/>
    <rect x="700" y="90" width="200" height="330" rx="4"/>
    <rect x="940" y="90" width="200" height="330" rx="4"/>
  </g>
  <rect x="0" y="440" width="1200" height="10" fill="#6d6049" opacity="0.6"/>

  <!-- Window into the dusk garden -->
  <g transform="translate(500 96)">
    <rect x="-14" y="-14" width="228" height="348" fill="#6d6049" opacity="0.8"/>
    <rect x="0" y="0" width="200" height="320" fill="#43514a"/>
    <path d="M0 220 q46 -34 96 -10 q52 -30 104 -8 L200 320 L0 320Z" fill="#2f3b35"/>
    <circle cx="150" cy="56" r="18" fill="#f4e2ba" opacity="0.55"/>
    <g stroke="#6d6049" stroke-width="7" fill="none"><path d="M100 0 V320 M0 160 H200"/></g>
  </g>

  <!-- Wall sconces -->
  <g>
    <g transform="translate(160 250)">
      <ellipse cx="0" cy="0" rx="130" ry="110" fill="#ffd79a" opacity="0.22" filter="url(#dBlur)"/>
      <path d="M-22 12 h44 l-8 -34 h-28 Z" fill="#e8cf9c"/>
      <rect x="-3" y="12" width="6" height="26" fill="#8a7247"/>
    </g>
    <g transform="translate(1040 250)">
      <ellipse cx="0" cy="0" rx="130" ry="110" fill="#ffd79a" opacity="0.22" filter="url(#dBlur)"/>
      <path d="M-22 12 h44 l-8 -34 h-28 Z" fill="#e8cf9c"/>
      <rect x="-3" y="12" width="6" height="26" fill="#8a7247"/>
    </g>
  </g>

  <!-- Chairs behind the table -->
  <g fill="#463a2b">
    <g transform="translate(330 470)">
      <rect x="0" y="0" width="130" height="150" rx="10" fill="#4a5f4c"/>
      <rect x="12" y="14" width="106" height="122" rx="8" fill="none" stroke="#6d8a70" stroke-width="3"/>
    </g>
    <g transform="translate(740 470)">
      <rect x="0" y="0" width="130" height="150" rx="10" fill="#4a5f4c"/>
      <rect x="12" y="14" width="106" height="122" rx="8" fill="none" stroke="#6d8a70" stroke-width="3"/>
    </g>
  </g>

  <!-- Table -->
  <path d="M120 620 H1080 L1160 900 H40 Z" fill="url(#dCloth)"/>
  <path d="M120 620 H1080 L1092 662 H108 Z" fill="#fffdf6" opacity="0.7"/>

  <!-- Candles -->
  <g transform="translate(600 470)">
    <g>
      <rect x="-7" y="0" width="14" height="140" fill="#f4ecd9"/>
      <path d="M0 -30 c14 16 10 30 0 30 c-10 0 -14 -14 0 -30Z" fill="#ffcf7a"/>
      <ellipse cx="0" cy="-8" rx="46" ry="60" fill="#ffcf7a" opacity="0.35" filter="url(#dBlurS)"/>
      <path d="M-26 140 h52 l-10 18 h-32 Z" fill="#b08d57"/>
      <ellipse cx="0" cy="160" rx="34" ry="8" fill="#8f6f3e"/>
    </g>
    <g transform="translate(-108 30) scale(0.86)">
      <rect x="-7" y="0" width="14" height="140" fill="#f4ecd9"/>
      <path d="M0 -30 c14 16 10 30 0 30 c-10 0 -14 -14 0 -30Z" fill="#ffcf7a"/>
      <ellipse cx="0" cy="-8" rx="46" ry="60" fill="#ffcf7a" opacity="0.32" filter="url(#dBlurS)"/>
      <path d="M-26 140 h52 l-10 18 h-32 Z" fill="#b08d57"/>
      <ellipse cx="0" cy="160" rx="34" ry="8" fill="#8f6f3e"/>
    </g>
    <g transform="translate(112 30) scale(0.86)">
      <rect x="-7" y="0" width="14" height="140" fill="#f4ecd9"/>
      <path d="M0 -30 c14 16 10 30 0 30 c-10 0 -14 -14 0 -30Z" fill="#ffcf7a"/>
      <ellipse cx="0" cy="-8" rx="46" ry="60" fill="#ffcf7a" opacity="0.32" filter="url(#dBlurS)"/>
      <path d="M-26 140 h52 l-10 18 h-32 Z" fill="#b08d57"/>
      <ellipse cx="0" cy="160" rx="34" ry="8" fill="#8f6f3e"/>
    </g>
  </g>

  <!-- Place settings -->
  <g>
    <!-- Left -->
    <g transform="translate(300 700)">
      <ellipse cx="0" cy="0" rx="104" ry="34" fill="#fffdf7"/>
      <ellipse cx="0" cy="-3" rx="72" ry="23" fill="#f3ecdd"/>
      <ellipse cx="0" cy="-3" rx="72" ry="23" fill="none" stroke="#b08d57" stroke-width="1.5" opacity="0.8"/>
      <rect x="-146" y="-16" width="8" height="46" rx="3" fill="#cfc7b4"/>
      <rect x="132" y="-16" width="8" height="46" rx="3" fill="#cfc7b4"/>
      <!-- Wine glass -->
      <g transform="translate(96 -78)">
        <path d="M-22 0 q22 54 22 54 q0 0 22 -54 Z" fill="#e8eee6" opacity="0.55"/>
        <path d="M-17 16 q17 34 17 34 q0 0 17 -34 Z" fill="url(#dWine)"/>
        <rect x="-2" y="54" width="4" height="30" fill="#e8eee6" opacity="0.6"/>
        <ellipse cx="0" cy="86" rx="18" ry="5" fill="#e8eee6" opacity="0.6"/>
      </g>
    </g>
    <!-- Right -->
    <g transform="translate(900 700)">
      <ellipse cx="0" cy="0" rx="104" ry="34" fill="#fffdf7"/>
      <ellipse cx="0" cy="-3" rx="72" ry="23" fill="#f3ecdd"/>
      <ellipse cx="0" cy="-3" rx="72" ry="23" fill="none" stroke="#b08d57" stroke-width="1.5" opacity="0.8"/>
      <rect x="-146" y="-16" width="8" height="46" rx="3" fill="#cfc7b4"/>
      <rect x="132" y="-16" width="8" height="46" rx="3" fill="#cfc7b4"/>
      <g transform="translate(-96 -78)">
        <path d="M-22 0 q22 54 22 54 q0 0 22 -54 Z" fill="#e8eee6" opacity="0.55"/>
        <path d="M-17 16 q17 34 17 34 q0 0 17 -34 Z" fill="url(#dWine)"/>
        <rect x="-2" y="54" width="4" height="30" fill="#e8eee6" opacity="0.6"/>
        <ellipse cx="0" cy="86" rx="18" ry="5" fill="#e8eee6" opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- Sprig of heather in a small vase -->
  <g transform="translate(600 640)">
    <path d="M-20 0 h40 l-6 46 h-28 Z" fill="#dfe4dd" opacity="0.7"/>
    <g stroke="#4a5f4c" stroke-width="2.5" fill="none">
      <path d="M0 0 V-46 M0 -20 l-16 -18 M0 -28 l16 -20"/>
    </g>
    <g fill="#8a6f92">
      <circle cx="0" cy="-50" r="5"/><circle cx="-18" cy="-40" r="4.5"/><circle cx="17" cy="-50" r="4.5"/>
      <circle cx="-8" cy="-58" r="3.5"/><circle cx="8" cy="-60" r="3.5"/>
    </g>
  </g>
</svg>
