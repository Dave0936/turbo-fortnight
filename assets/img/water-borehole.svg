<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A completed water supply borehole headworks with casing, pump and rising main below the water table">
  <defs>
    <linearGradient id="wbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2429"/>
      <stop offset="1" stop-color="#333c42"/>
    </linearGradient>
    <linearGradient id="wbWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4d5c"/>
      <stop offset="1" stop-color="#1b2f3a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#wbSky)"/>

  <!-- Ground profile -->
  <rect y="220" width="800" height="70" fill="#3b3a33"/>
  <rect y="290" width="800" height="90" fill="#4a453a"/>
  <rect y="380" width="800" height="90" fill="#565046"/>
  <rect y="470" width="800" height="130" fill="url(#wbWater)"/>
  <g stroke="#0e1113" stroke-width="2" opacity="0.45">
    <path d="M0 290 H800 M0 380 H800 M0 470 H800"/>
  </g>
  <!-- Aquifer texture -->
  <g fill="#4c7288" opacity="0.35">
    <circle cx="90" cy="512" r="7"/><circle cx="176" cy="546" r="5"/><circle cx="268" cy="500" r="6"/>
    <circle cx="360" cy="560" r="7"/><circle cx="470" cy="516" r="5"/><circle cx="592" cy="552" r="6"/>
    <circle cx="700" cy="504" r="7"/><circle cx="756" cy="562" r="5"/>
  </g>

  <!-- Water table marker -->
  <path d="M0 470 H800" stroke="#ff6a13" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="620" y="458" fill="#ff6a13" font-family="'Space Grotesk',Helvetica,Arial,sans-serif" font-size="18" font-weight="500">Water table</text>

  <!-- Borehole casing -->
  <rect x="356" y="220" width="88" height="380" fill="#12161a"/>
  <rect x="366" y="220" width="68" height="380" fill="#1d2327"/>
  <g stroke="#4a5157" stroke-width="3">
    <path d="M366 220 V600 M434 220 V600"/>
  </g>
  <!-- Slotted screen in the aquifer -->
  <g stroke="#7d868c" stroke-width="3">
    <path d="M372 486 H428 M372 506 H428 M372 526 H428 M372 546 H428 M372 566 H428"/>
  </g>

  <!-- Rising main and pump -->
  <path d="M400 250 V520" stroke="#98a0a6" stroke-width="7"/>
  <rect x="384" y="520" width="32" height="56" rx="4" fill="#4a5157"/>
  <rect x="390" y="530" width="20" height="8" fill="#ff6a13"/>

  <!-- Headworks chamber -->
  <g>
    <rect x="320" y="164" width="160" height="60" fill="#2b3237" stroke="#4a5157" stroke-width="3"/>
    <rect x="336" y="176" width="128" height="12" fill="#12161a"/>
    <path d="M480 194 H600" stroke="#98a0a6" stroke-width="9"/>
    <rect x="600" y="176" width="46" height="36" fill="#4a5157"/>
    <circle cx="623" cy="194" r="8" fill="#e8112d"/>
  </g>
  <!-- Grout seal -->
  <path d="M356 224 h88 v40 h-88 z" fill="#6b6257"/>

  <!-- Depth ticks -->
  <g stroke="#7d868c" stroke-width="2">
    <path d="M700 224 v370"/>
    <path d="M694 290 h12 M694 380 h12 M694 470 h12 M694 560 h12"/>
  </g>
</svg>
