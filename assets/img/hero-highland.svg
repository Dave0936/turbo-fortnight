<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dawn mist over the Highland glen at Coul House">
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#243546"/>
      <stop offset="34%"  stop-color="#4a5a63"/>
      <stop offset="60%"  stop-color="#9d8a76"/>
      <stop offset="78%"  stop-color="#d8b58c"/>
      <stop offset="100%" stop-color="#eccfa6"/>
    </linearGradient>
    <radialGradient id="hSun" cx="0.66" cy="0.86" r="0.45">
      <stop offset="0%"   stop-color="#ffe6bd" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#f0c58e" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f0c58e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e7f85"/><stop offset="100%" stop-color="#8b9791"/>
    </linearGradient>
    <linearGradient id="hMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c5f5b"/><stop offset="100%" stop-color="#5d6d62"/>
    </linearGradient>
    <linearGradient id="hNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#324439"/><stop offset="100%" stop-color="#2a3a30"/>
    </linearGradient>
    <linearGradient id="hLoch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c7b295"/>
      <stop offset="30%"  stop-color="#8c9186"/>
      <stop offset="100%" stop-color="#3f4c42"/>
    </linearGradient>
    <linearGradient id="hFore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a20"/><stop offset="100%" stop-color="#131b14"/>
    </linearGradient>
    <linearGradient id="hMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8ddcb" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e8ddcb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8ddcb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hWinGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdca8"/><stop offset="100%" stop-color="#f2b96c"/>
    </linearGradient>
    <filter id="hSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="hSoft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Sky and low sun -->
  <rect width="1600" height="900" fill="url(#hSky)"/>
  <ellipse cx="1060" cy="640" rx="720" ry="420" fill="url(#hSun)"/>
  <circle cx="1058" cy="596" r="34" fill="#ffe9c4" opacity="0.75" filter="url(#hSoft2)"/>

  <!-- Drifting cloud bands -->
  <g opacity="0.3" fill="#e9dcc8" filter="url(#hSoft)">
    <ellipse cx="380" cy="196" rx="330" ry="26"/>
    <ellipse cx="1180" cy="150" rx="290" ry="20"/>
    <ellipse cx="820" cy="272" rx="420" ry="18"/>
  </g>

  <!-- Distant range -->
  <path fill="url(#hFar)" opacity="0.85"
        d="M0 596 L118 528 205 566 316 476 424 546 520 500 640 570 742 512 858 574 968 520 1092 580 1214 522 1330 578 1448 530 1600 592 1600 900 0 900Z"/>
  <!-- Mist over the far range -->
  <rect x="0" y="556" width="1600" height="90" fill="url(#hMist)"/>

  <!-- Middle range -->
  <path fill="url(#hMid)"
        d="M0 664 L136 606 268 650 392 588 508 644 628 604 760 660 884 610 1010 656 1140 606 1268 652 1400 612 1520 654 1600 630 1600 900 0 900Z"/>
  <rect x="0" y="626" width="1600" height="80" fill="url(#hMist)" opacity="0.75"/>

  <!-- Near hills -->
  <path fill="url(#hNear)"
        d="M0 726 L150 690 300 720 452 682 604 718 760 688 918 722 1074 690 1232 722 1388 692 1540 724 1600 706 1600 900 0 900Z"/>

  <!-- Loch, catching the last of the light -->
  <path fill="url(#hLoch)" d="M0 748 H1600 V900 H0 Z"/>
  <g opacity="0.5" fill="#f6e2c2">
    <rect x="900" y="766" width="330" height="2.5" rx="1.25"/>
    <rect x="960" y="782" width="220" height="2" rx="1"/>
    <rect x="880" y="798" width="390" height="2.5" rx="1.25"/>
    <rect x="950" y="816" width="250" height="2" rx="1"/>
    <rect x="900" y="836" width="340" height="2.5" rx="1.25"/>
  </g>
  <g opacity="0.22" fill="#e4d6bd">
    <rect x="200" y="774" width="260" height="2" rx="1"/>
    <rect x="320" y="806" width="200" height="2" rx="1"/>
    <rect x="140" y="840" width="300" height="2" rx="1"/>
  </g>

  <!-- The house on the rise, windows lit -->
  <g transform="translate(560 560)">
    <g fill="#1c2620">
      <rect x="0" y="46" width="300" height="118"/>
      <rect x="-56" y="76" width="60" height="88"/>
      <rect x="300" y="76" width="60" height="88"/>
      <path d="M-8 46 L150 -6 308 46 Z"/>
      <path d="M-60 76 L-26 54 8 76 Z"/>
      <path d="M296 76 L330 54 364 76 Z"/>
      <rect x="52" y="-2" width="18" height="34"/>
      <rect x="228" y="-2" width="18" height="34"/>
    </g>
    <g fill="url(#hWinGlow)" opacity="0.92">
      <rect x="30"  y="70"  width="19" height="27" rx="1"/>
      <rect x="76"  y="70"  width="19" height="27" rx="1"/>
      <rect x="122" y="70"  width="19" height="27" rx="1"/>
      <rect x="168" y="70"  width="19" height="27" rx="1"/>
      <rect x="214" y="70"  width="19" height="27" rx="1"/>
      <rect x="260" y="70"  width="19" height="27" rx="1"/>
      <rect x="30"  y="118" width="19" height="30" rx="1"/>
      <rect x="76"  y="118" width="19" height="30" rx="1"/>
      <rect x="168" y="118" width="19" height="30" rx="1"/>
      <rect x="214" y="118" width="19" height="30" rx="1"/>
      <rect x="260" y="118" width="19" height="30" rx="1"/>
      <rect x="-40" y="104" width="17" height="26" rx="1"/>
      <rect x="316" y="104" width="17" height="26" rx="1"/>
      <path d="M122 118 h42 v46 h-42 z"/>
    </g>
    <g opacity="0.5" filter="url(#hSoft2)" fill="#ffd79a">
      <rect x="24" y="64" width="266" height="92" rx="8"/>
      <rect x="118" y="112" width="50" height="56" rx="6"/>
    </g>
  </g>

  <!-- Foreground bank and pines -->
  <path fill="url(#hFore)"
        d="M0 812 C220 776, 420 800, 640 826 C880 854, 1140 830, 1380 848 C1470 855, 1540 862, 1600 858 L1600 900 L0 900 Z"/>
  <g fill="#131b14">
    <g transform="translate(96 830) scale(1.15)">
      <path d="M0 0 L-30 0 L-16 -34 L-25 -34 L-12 -66 L-19 -66 L0 -110 L19 -66 L12 -66 L25 -34 L16 -34 L30 0 Z"/>
      <rect x="-4" y="-4" width="8" height="22"/>
    </g>
    <g transform="translate(178 838) scale(0.82)">
      <path d="M0 0 L-30 0 L-16 -34 L-25 -34 L-12 -66 L-19 -66 L0 -110 L19 -66 L12 -66 L25 -34 L16 -34 L30 0 Z"/>
      <rect x="-4" y="-4" width="8" height="22"/>
    </g>
    <g transform="translate(1476 846) scale(1.3)">
      <path d="M0 0 L-30 0 L-16 -34 L-25 -34 L-12 -66 L-19 -66 L0 -110 L19 -66 L12 -66 L25 -34 L16 -34 L30 0 Z"/>
      <rect x="-4" y="-4" width="8" height="22"/>
    </g>
    <g transform="translate(1382 852) scale(0.9)">
      <path d="M0 0 L-30 0 L-16 -34 L-25 -34 L-12 -66 L-19 -66 L0 -110 L19 -66 L12 -66 L25 -34 L16 -34 L30 0 Z"/>
      <rect x="-4" y="-4" width="8" height="22"/>
    </g>
  </g>

  <!-- Low mist across the foreground -->
  <rect x="0" y="778" width="1600" height="66" fill="url(#hMist)" opacity="0.42"/>
</svg>
