<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A hill path winding through heather above the glen">
  <defs>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d99ad"/><stop offset="60%" stop-color="#b9c6c6"/><stop offset="100%" stop-color="#dcd8c8"/>
    </linearGradient>
    <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f8f95"/><stop offset="100%" stop-color="#9aa49c"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f7062"/><stop offset="100%" stop-color="#6f7d64"/>
    </linearGradient>
    <linearGradient id="gNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b6248"/><stop offset="100%" stop-color="#4d5138"/>
    </linearGradient>
    <linearGradient id="gMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e2d2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e7e2d2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e7e2d2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#gSky)"/>
  <g opacity="0.4" fill="#eff0e6">
    <ellipse cx="280" cy="140" rx="230" ry="34"/><ellipse cx="880" cy="106" rx="260" ry="28"/>
    <ellipse cx="600" cy="212" rx="320" ry="22"/>
  </g>

  <path fill="url(#gFar)" d="M0 400 L130 330 250 386 380 300 500 372 630 316 760 380 890 322 1020 384 1140 336 1200 372 1200 900 0 900Z"/>
  <rect x="0" y="356" width="1200" height="90" fill="url(#gMist)"/>

  <path fill="url(#gMid)" d="M0 500 L150 452 300 496 450 440 600 492 750 448 900 500 1050 452 1200 494 1200 900 0 900Z"/>
  <rect x="0" y="470" width="1200" height="80" fill="url(#gMist)" opacity="0.6"/>

  <!-- Heather-covered near slope -->
  <path fill="url(#gNear)" d="M0 590 C200 548, 420 604, 620 578 C820 552, 1000 600, 1200 570 L1200 900 L0 900Z"/>

  <!-- Winding path -->
  <path d="M540 900 C560 790, 520 720, 560 660 C596 606, 660 596, 690 566"
        fill="none" stroke="#c3b79c" stroke-width="66" stroke-linecap="round" opacity="0.85"/>
  <path d="M540 900 C560 790, 520 720, 560 660 C596 606, 660 596, 690 566"
        fill="none" stroke="#d6cbb0" stroke-width="40" stroke-linecap="round" opacity="0.7"/>

  <!-- Heather clumps -->
  <g fill="#7b6480" opacity="0.65">
    <ellipse cx="120" cy="700" rx="82" ry="30"/><ellipse cx="300" cy="770" rx="96" ry="34"/>
    <ellipse cx="230" cy="840" rx="110" ry="36"/><ellipse cx="900" cy="700" rx="90" ry="32"/>
    <ellipse cx="1060" cy="780" rx="110" ry="36"/><ellipse cx="880" cy="852" rx="120" ry="38"/>
    <ellipse cx="700" cy="736" rx="70" ry="26"/>
  </g>
  <g fill="#8d7593" opacity="0.5">
    <ellipse cx="160" cy="676" rx="52" ry="20"/><ellipse cx="1000" cy="722" rx="58" ry="20"/>
    <ellipse cx="380" cy="812" rx="60" ry="22"/>
  </g>
  <g fill="#4f5b3c" opacity="0.55">
    <ellipse cx="60" cy="760" rx="90" ry="28"/><ellipse cx="440" cy="720" rx="70" ry="24"/>
    <ellipse cx="1140" cy="716" rx="80" ry="26"/><ellipse cx="760" cy="850" rx="90" ry="30"/>
  </g>

  <!-- Scattered boulders -->
  <g fill="#8b8b7e">
    <ellipse cx="420" cy="640" rx="30" ry="18"/><ellipse cx="392" cy="648" rx="18" ry="11"/>
    <ellipse cx="856" cy="620" rx="24" ry="14"/>
    <ellipse cx="190" cy="612" rx="26" ry="15"/>
  </g>
  <g fill="#a09f8f" opacity="0.6">
    <ellipse cx="424" cy="634" rx="20" ry="10"/><ellipse cx="858" cy="616" rx="15" ry="8"/>
  </g>

  <!-- Lone pine -->
  <g transform="translate(980 600)" fill="#33422f">
    <rect x="-6" y="-40" width="12" height="60"/>
    <path d="M0 -180 L34 -110 L14 -110 L44 -50 L18 -50 L52 -8 L-52 -8 L-18 -50 L-44 -50 L-14 -110 L-34 -110Z"/>
  </g>
  <g transform="translate(1058 632) scale(0.7)" fill="#33422f">
    <rect x="-6" y="-40" width="12" height="60"/>
    <path d="M0 -180 L34 -110 L14 -110 L44 -50 L18 -50 L52 -8 L-52 -8 L-18 -50 L-44 -50 L-14 -110 L-34 -110Z"/>
  </g>
</svg>
