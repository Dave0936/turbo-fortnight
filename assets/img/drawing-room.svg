<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The drawing room with a log fire and deep armchairs">
  <defs>
    <linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5744"/><stop offset="100%" stop-color="#3f3d30"/>
    </linearGradient>
    <radialGradient id="rFireGlow" cx="0.5" cy="0.72" r="0.5">
      <stop offset="0%" stop-color="#ffb765" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb765" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rFire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff8a2b"/><stop offset="55%" stop-color="#ffc55f"/><stop offset="100%" stop-color="#ffeaa8"/>
    </linearGradient>
    <filter id="rBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="rBlurS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#rWall)"/>

  <!-- Panelling -->
  <g fill="none" stroke="#6f6a52" stroke-width="4" opacity="0.5">
    <rect x="40" y="70" width="230" height="380" rx="4"/>
    <rect x="930" y="70" width="230" height="380" rx="4"/>
  </g>

  <!-- Chimney breast and fireplace -->
  <g transform="translate(600 0)">
    <rect x="-260" y="0" width="520" height="700" fill="#514e3d"/>
    <rect x="-276" y="330" width="552" height="26" fill="#cfc3a4"/>
    <rect x="-268" y="356" width="536" height="12" fill="#b7ab8c"/>
    <!-- Surround -->
    <rect x="-210" y="368" width="420" height="332" fill="#c7bb9c"/>
    <rect x="-150" y="410" width="300" height="290" fill="#241d16"/>
    <!-- Fire -->
    <ellipse cx="0" cy="620" rx="330" ry="280" fill="url(#rFireGlow)"/>
    <g fill="#3b2b1f">
      <rect x="-104" y="626" width="208" height="18" rx="6"/>
      <rect x="-84" y="600" width="170" height="18" rx="6" transform="rotate(-6 0 610)"/>
      <rect x="-80" y="580" width="160" height="16" rx="6" transform="rotate(7 0 588)"/>
    </g>
    <g filter="url(#rBlurS)">
      <path d="M0 470 c46 60 62 88 44 128 c-12 26 -34 34 -44 34 c-10 0 -32 -8 -44 -34 c-18 -40 -2 -68 44 -128Z" fill="url(#rFire)"/>
      <path d="M-40 540 c22 34 28 48 20 68 c-6 14 -16 18 -20 18 c-4 0 -16 -4 -22 -18 c-8 -20 0 -34 22 -68Z" fill="url(#rFire)" opacity="0.85"/>
      <path d="M44 546 c20 32 26 44 18 62 c-6 13 -14 17 -18 17 c-4 0 -15 -4 -20 -17 c-8 -18 0 -30 20 -62Z" fill="url(#rFire)" opacity="0.85"/>
    </g>
    <!-- Mantel dressing -->
    <g transform="translate(-190 246)">
      <rect x="-8" y="0" width="16" height="84" fill="#f2e8cf"/>
      <ellipse cx="0" cy="-6" rx="30" ry="40" fill="#ffcf7a" opacity="0.35" filter="url(#rBlurS)"/>
      <path d="M0 -20 c10 12 7 20 0 20 c-7 0 -10 -8 0 -20Z" fill="#ffcf7a"/>
    </g>
    <g transform="translate(190 246)">
      <rect x="-8" y="0" width="16" height="84" fill="#f2e8cf"/>
      <ellipse cx="0" cy="-6" rx="30" ry="40" fill="#ffcf7a" opacity="0.35" filter="url(#rBlurS)"/>
      <path d="M0 -20 c10 12 7 20 0 20 c-7 0 -10 -8 0 -20Z" fill="#ffcf7a"/>
    </g>
    <!-- Gilt mirror above -->
    <g>
      <rect x="-150" y="90" width="300" height="220" rx="6" fill="#8f6f3e"/>
      <rect x="-136" y="104" width="272" height="192" rx="4" fill="#3b4038"/>
      <path d="M-136 104 L136 296 L136 104 Z" fill="#4b5147" opacity="0.6"/>
      <path d="M-150 90 q150 -54 300 0" fill="none" stroke="#b08d57" stroke-width="8"/>
    </g>
  </g>

  <!-- Floor -->
  <rect x="0" y="700" width="1200" height="200" fill="#6a4f34"/>
  <g opacity="0.22" stroke="#43301d" stroke-width="2"><path d="M0 736 H1200 M0 786 H1200 M0 842 H1200"/></g>
  <rect x="110" y="748" width="980" height="152" fill="#6b4a4a" opacity="0.8"/>
  <rect x="140" y="764" width="920" height="120" fill="none" stroke="#c2a06a" stroke-width="3" opacity="0.7"/>

  <!-- Wing armchairs, turned to the fire -->
  <g transform="translate(150 470)">
    <path d="M0 300 h250 v-176 a40 40 0 0 0 -40 -40 h-170 a40 40 0 0 0 -40 40 Z" fill="#6b4a4a"/>
    <path d="M-6 132 h58 v168 h-58 a12 12 0 0 1 -12 -12 Z" fill="#5c3d3d"/>
    <path d="M256 132 h-58 v168 h58 a12 12 0 0 0 12 -12 Z" fill="#5c3d3d"/>
    <rect x="46" y="206" width="158" height="60" rx="12" fill="#7d5757"/>
    <rect x="70" y="120" width="110" height="70" rx="14" fill="#8a6f92" opacity="0.5"/>
  </g>
  <g transform="translate(800 470)">
    <path d="M0 300 h250 v-176 a40 40 0 0 0 -40 -40 h-170 a40 40 0 0 0 -40 40 Z" fill="#4a5f4c"/>
    <path d="M-6 132 h58 v168 h-58 a12 12 0 0 1 -12 -12 Z" fill="#3f5142"/>
    <path d="M256 132 h-58 v168 h58 a12 12 0 0 0 12 -12 Z" fill="#3f5142"/>
    <rect x="46" y="206" width="158" height="60" rx="12" fill="#5d7360"/>
    <rect x="70" y="120" width="110" height="70" rx="14" fill="#c2a06a" opacity="0.45"/>
  </g>

  <!-- Low table with a dram -->
  <g transform="translate(548 690)">
    <rect x="-56" y="0" width="112" height="10" rx="3" fill="#4a3626"/>
    <rect x="-46" y="10" width="10" height="66" fill="#4a3626"/>
    <rect x="36" y="10" width="10" height="66" fill="#4a3626"/>
    <g transform="translate(0 -30)">
      <path d="M-14 0 h28 l-4 30 h-20 Z" fill="#e8eee6" opacity="0.6"/>
      <path d="M-11 12 h22 l-3 18 h-16 Z" fill="#c98b3a"/>
    </g>
  </g>
</svg>
