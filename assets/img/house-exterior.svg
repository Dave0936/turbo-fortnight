<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The Georgian frontage of Coul House across its lawns">
  <defs>
    <linearGradient id="eSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fb2bd"/><stop offset="55%" stop-color="#c6cfcb"/><stop offset="100%" stop-color="#e4dfd0"/>
    </linearGradient>
    <linearGradient id="eWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ebe0"/><stop offset="100%" stop-color="#ddd5c5"/>
    </linearGradient>
    <linearGradient id="eWallSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2dbcc"/><stop offset="100%" stop-color="#cec5b3"/>
    </linearGradient>
    <linearGradient id="eLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f8461"/><stop offset="100%" stop-color="#455438"/>
    </linearGradient>
    <linearGradient id="eGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d4a4e"/><stop offset="55%" stop-color="#5d6b6c"/><stop offset="100%" stop-color="#2f3a3d"/>
    </linearGradient>
    <linearGradient id="eRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f5450"/><stop offset="100%" stop-color="#3a3f3c"/>
    </linearGradient>
    <filter id="eBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#eSky)"/>
  <g opacity="0.5" fill="#eef0e9" filter="url(#eBlur)">
    <ellipse cx="260" cy="150" rx="240" ry="52"/>
    <ellipse cx="920" cy="110" rx="270" ry="46"/>
  </g>

  <!-- Distant treeline -->
  <path fill="#5b6b56" opacity="0.65" d="M0 452 q70 -46 130 -8 q60 -50 128 -6 q66 -46 132 -4 q68 -48 136 -6 q64 -44 130 -6 q70 -46 136 -4 q66 -44 130 -8 q56 -34 78 -12 L1200 900 L0 900Z"/>

  <!-- Lawn -->
  <path fill="url(#eLawn)" d="M0 620 C300 596, 900 596, 1200 620 L1200 900 L0 900Z"/>
  <path fill="#54654a" opacity="0.55" d="M0 700 C320 676, 880 676, 1200 700 L1200 760 C880 738, 320 738, 0 760Z"/>

  <!-- Gravel sweep -->
  <path fill="#c9bfa9" d="M180 900 C240 760, 480 706, 600 706 C720 706, 960 760, 1020 900Z"/>
  <path fill="#b8ad95" opacity="0.5" d="M262 900 C312 786, 500 740, 600 740 C700 740, 888 786, 938 900Z"/>

  <!-- House -->
  <g transform="translate(600 0)">
    <!-- Side wings -->
    <rect x="-460" y="382" width="150" height="230" fill="url(#eWallSide)"/>
    <rect x="310" y="382" width="150" height="230" fill="url(#eWallSide)"/>
    <path d="M-472 382 L-385 338 L-298 382 Z" fill="url(#eRoof)"/>
    <path d="M298 382 L385 338 L472 382 Z" fill="url(#eRoof)"/>

    <!-- Main block -->
    <rect x="-312" y="300" width="624" height="312" fill="url(#eWall)"/>
    <path d="M-330 300 L0 168 L330 300 Z" fill="url(#eRoof)"/>
    <rect x="-330" y="292" width="660" height="14" fill="#cfc6b4"/>

    <!-- Chimneys -->
    <g fill="#c8bda9">
      <rect x="-208" y="176" width="44" height="66"/><rect x="164" y="176" width="44" height="66"/>
      <rect x="-214" y="168" width="56" height="12"/><rect x="158" y="168" width="56" height="12"/>
    </g>

    <!-- Portico -->
    <g>
      <rect x="-86" y="452" width="172" height="160" fill="#e7e1d4"/>
      <path d="M-102 452 L0 400 L102 452 Z" fill="#ded6c6"/>
      <g fill="#d4cbb9">
        <rect x="-78" y="466" width="18" height="146"/>
        <rect x="-30" y="466" width="18" height="146"/>
        <rect x="12"  y="466" width="18" height="146"/>
        <rect x="60"  y="466" width="18" height="146"/>
      </g>
      <rect x="-34" y="486" width="68" height="126" fill="#2f3a2f"/>
      <rect x="-34" y="486" width="68" height="16" fill="#4a5647"/>
      <circle cx="18" cy="552" r="4" fill="#b08d57"/>
    </g>

    <!-- Windows: sash, twelve-pane, in three tiers -->
    <g>
      <g fill="url(#eGlass)" stroke="#efe9dc" stroke-width="3">
        <rect x="-276" y="340" width="52" height="72"/><rect x="-186" y="340" width="52" height="72"/>
        <rect x="-96"  y="340" width="52" height="72"/><rect x="44"  y="340" width="52" height="72"/>
        <rect x="134"  y="340" width="52" height="72"/><rect x="224" y="340" width="52" height="72"/>
        <rect x="-276" y="452" width="52" height="82"/><rect x="-186" y="452" width="52" height="82"/>
        <rect x="-96"  y="452" width="52" height="82"/><rect x="44"  y="452" width="52" height="82"/>
        <rect x="134"  y="452" width="52" height="82"/><rect x="224" y="452" width="52" height="82"/>
        <rect x="-430" y="424" width="46" height="70"/><rect x="-360" y="424" width="46" height="70"/>
        <rect x="356"  y="424" width="46" height="70"/><rect x="426" y="424" width="46" height="70"/>
      </g>
      <g stroke="#efe9dc" stroke-width="2" opacity="0.85">
        <path d="M-276 376 h52 M-250 340 v72 M-186 376 h52 M-160 340 v72 M-96 376 h52 M-70 340 v72
                 M44 376 h52 M70 340 v72 M134 376 h52 M160 340 v72 M224 376 h52 M250 340 v72
                 M-276 493 h52 M-250 452 v82 M-186 493 h52 M-160 452 v82 M-96 493 h52 M-70 452 v82
                 M44 493 h52 M70 452 v82 M134 493 h52 M160 452 v82 M224 493 h52 M250 452 v82"/>
      </g>
      <!-- Fanlight above the door -->
      <path d="M-24 486 a24 24 0 0 1 48 0 Z" fill="#f2d9a8" opacity="0.8"/>
    </g>

    <!-- Steps -->
    <g fill="#cdc4b0">
      <rect x="-96" y="612" width="192" height="12"/>
      <rect x="-108" y="624" width="216" height="12"/>
      <rect x="-120" y="636" width="240" height="12"/>
    </g>

    <!-- Ivy and planting at the base -->
    <g fill="#3f5138" opacity="0.9">
      <ellipse cx="-330" cy="612" rx="54" ry="24"/>
      <ellipse cx="330" cy="612" rx="54" ry="24"/>
      <ellipse cx="-150" cy="648" rx="42" ry="18"/>
      <ellipse cx="176" cy="648" rx="42" ry="18"/>
    </g>
    <g fill="#4a5f40" opacity="0.55">
      <path d="M-312 612 q28 -90 6 -170 q34 66 22 170 Z"/>
      <path d="M312 612 q-28 -90 -6 -170 q-34 66 -22 170 Z"/>
    </g>
  </g>

  <!-- Framing trees -->
  <g fill="#2f4030">
    <path d="M-10 900 C40 720, 20 560, 96 470 C150 406, 190 470, 168 560 C150 640, 176 780, 150 900Z" opacity="0.95"/>
    <ellipse cx="100" cy="430" rx="130" ry="112" opacity="0.95"/>
    <ellipse cx="46" cy="500" rx="104" ry="86" opacity="0.9"/>
  </g>
  <g fill="#35492f">
    <ellipse cx="1132" cy="452" rx="140" ry="122"/>
    <ellipse cx="1186" cy="536" rx="112" ry="94"/>
    <path d="M1120 900 C1104 760, 1120 600, 1140 520 L1180 528 C1166 620, 1180 780, 1190 900Z"/>
  </g>
</svg>
