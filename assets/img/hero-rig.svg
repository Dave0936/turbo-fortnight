<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A drilling rig mast silhouetted against a dawn sky on a Scottish site">
  <defs>
    <!-- Dawn. Bright enough through the middle that the rig reads as a true
         silhouette against it rather than black on black. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a20"/>
      <stop offset="0.3" stop-color="#23303a"/>
      <stop offset="0.55" stop-color="#4d4238"/>
      <stop offset="0.75" stop-color="#8f5024"/>
      <stop offset="0.92" stop-color="#d4611f"/>
      <stop offset="1" stop-color="#f0791f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a13" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8f45" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b333a"/>
      <stop offset="1" stop-color="#1e242a"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a1d"/>
      <stop offset="1" stop-color="#0e1113"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181b"/>
      <stop offset="1" stop-color="#0b0e10"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1060" cy="596" rx="560" ry="170" fill="url(#glow)" opacity="0.8"/>
  <circle cx="1060" cy="584" r="52" fill="#ffc48a" opacity="0.6"/>

  <!-- Distant hills -->
  <path d="M0 560 L160 500 L300 546 L430 486 L560 540 L700 470 L840 528 L980 492 L1130 544 L1290 496 L1440 546 L1600 508 L1600 640 L0 640 Z" fill="url(#hillFar)"/>
  <path d="M0 600 L190 556 L360 596 L520 552 L690 598 L880 560 L1060 604 L1250 566 L1430 606 L1600 574 L1600 700 L0 700 Z" fill="url(#hillNear)"/>

  <!-- Ground -->
  <rect x="0" y="660" width="1600" height="240" fill="url(#ground)"/>
  <path d="M0 668 H1600" stroke="#333a3f" stroke-width="1.5" opacity="0.6"/>
  <path d="M120 706 H520 M700 726 H1180 M240 762 H860 M980 792 H1520" stroke="#22272b" stroke-width="2" opacity="0.8"/>

  <!-- Rig mast -->
  <g fill="none" stroke="#0b0e10" stroke-width="7" stroke-linecap="square">
    <path d="M470 668 L520 150"/>
    <path d="M610 668 L560 150"/>
    <path d="M520 150 H560"/>
    <path d="M486 500 H596 M494 420 H588 M502 340 H580 M510 262 H572 M516 200 H566"/>
    <path d="M486 500 L588 420 M494 420 L580 340 M502 340 L572 262 M510 262 L566 200"/>
    <path d="M596 420 L502 340 M588 340 L510 262 M580 262 L516 200"/>
  </g>
  <!-- Crown block and travelling block -->
  <rect x="516" y="126" width="52" height="26" fill="#0b0e10"/>
  <path d="M542 152 V300" stroke="#0b0e10" stroke-width="4"/>
  <rect x="524" y="300" width="36" height="54" fill="#0b0e10"/>
  <path d="M542 354 V668" stroke="#0b0e10" stroke-width="5"/>
  <!-- Warning light -->
  <circle cx="542" cy="118" r="7" fill="#e8112d"/>

  <!-- Rig base and cabin -->
  <path d="M430 668 h250 v-46 h-40 v-40 h-96 v40 h-114 z" fill="#0b0e10"/>
  <rect x="690" y="586" width="150" height="82" fill="#0b0e10"/>
  <rect x="712" y="606" width="42" height="30" fill="#ff8f45" opacity="0.35"/>
  <rect x="770" y="606" width="42" height="30" fill="#ff8f45" opacity="0.25"/>

  <!-- Support truck -->
  <g fill="#0b0e10">
    <rect x="1000" y="596" width="210" height="56"/>
    <path d="M1210 652 v-40 h58 l34 40 z"/>
    <circle cx="1052" cy="656" r="17"/>
    <circle cx="1160" cy="656" r="17"/>
    <circle cx="1256" cy="656" r="17"/>
  </g>

  <!-- Casing stack -->
  <g fill="#0b0e10">
    <rect x="196" y="640" width="150" height="9"/>
    <rect x="200" y="651" width="150" height="9"/>
    <rect x="196" y="662" width="150" height="9"/>
  </g>

  <!-- Two figures in silhouette -->
  <g fill="#0b0e10">
    <path d="M886 668 v-38 a9 9 0 0 1 18 0 v38 z"/>
    <circle cx="895" cy="620" r="8"/>
    <path d="M926 668 v-34 a8 8 0 0 1 16 0 v34 z"/>
    <circle cx="934" cy="626" r="7"/>
  </g>

  <!-- Fence line -->
  <g stroke="#161a1d" stroke-width="3">
    <path d="M0 690 H1600"/>
    <path d="M60 668 v34 M180 668 v34 M300 668 v34 M1340 668 v34 M1460 668 v34"/>
  </g>
</svg>
