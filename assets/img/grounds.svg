<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Lawns and mature trees in the grounds on a bright afternoon">
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#89a8bd"/><stop offset="60%" stop-color="#c2cfcd"/><stop offset="100%" stop-color="#e5e0cf"/>
    </linearGradient>
    <linearGradient id="pLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d9163"/><stop offset="55%" stop-color="#5d7449"/><stop offset="100%" stop-color="#3f5233"/>
    </linearGradient>
    <linearGradient id="pTree" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5b7a4a"/><stop offset="100%" stop-color="#2f4530"/>
    </linearGradient>
    <filter id="pBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#pSky)"/>
  <g opacity="0.55" fill="#f2f2ea" filter="url(#pBlur)">
    <ellipse cx="240" cy="130" rx="230" ry="46"/><ellipse cx="820" cy="96" rx="270" ry="40"/>
    <ellipse cx="1080" cy="180" rx="180" ry="30"/>
  </g>

  <!-- Far woodland -->
  <path fill="#4e6446" opacity="0.7"
        d="M0 424 q60 -44 118 -10 q56 -48 116 -8 q60 -44 120 -6 q62 -46 124 -4 q58 -42 118 -8 q62 -44 124 -6 q60 -42 120 -8 q52 -32 80 -10 L1200 900 L0 900Z"/>

  <!-- Lawn tiers -->
  <path fill="url(#pLawn)" d="M0 470 C260 440, 940 440, 1200 470 L1200 900 L0 900Z"/>
  <path fill="#4f6640" opacity="0.5" d="M0 604 C280 578, 920 578, 1200 604 L1200 660 C920 634, 280 634, 0 660Z"/>
  <!-- Mown stripes -->
  <g opacity="0.14" fill="#dfe6cf">
    <path d="M120 900 L300 520 L370 520 L250 900Z"/>
    <path d="M420 900 L520 520 L590 520 L530 900Z"/>
    <path d="M720 900 L720 520 L790 520 L840 900Z"/>
    <path d="M1000 900 L920 520 L990 520 L1120 900Z"/>
  </g>

  <!-- Gravel path curving away -->
  <path d="M600 900 C620 780, 560 690, 600 620 C640 552, 720 540, 760 500"
        fill="none" stroke="#cdc0a4" stroke-width="86" stroke-linecap="round" opacity="0.85"/>
  <path d="M600 900 C620 780, 560 690, 600 620 C640 552, 720 540, 760 500"
        fill="none" stroke="#ded3b9" stroke-width="52" stroke-linecap="round" opacity="0.7"/>

  <!-- Specimen trees -->
  <g>
    <g transform="translate(180 0)">
      <path d="M-14 620 q6 -120 -4 -190 h36 q-10 70 -4 190Z" fill="#4a3a28"/>
      <ellipse cx="0" cy="380" rx="170" ry="140" fill="url(#pTree)"/>
      <ellipse cx="-84" cy="440" rx="110" ry="86" fill="url(#pTree)"/>
      <ellipse cx="86" cy="446" rx="106" ry="82" fill="url(#pTree)"/>
      <ellipse cx="-30" cy="316" rx="100" ry="78" fill="#6a8a54" opacity="0.55"/>
      <ellipse cx="0" cy="628" rx="150" ry="24" fill="#33452b" opacity="0.4"/>
    </g>
    <g transform="translate(1020 40)">
      <path d="M-12 590 q6 -110 -4 -176 h32 q-10 66 -4 176Z" fill="#4a3a28"/>
      <ellipse cx="0" cy="368" rx="160" ry="132" fill="url(#pTree)"/>
      <ellipse cx="-80" cy="424" rx="104" ry="80" fill="url(#pTree)"/>
      <ellipse cx="82" cy="428" rx="100" ry="78" fill="url(#pTree)"/>
      <ellipse cx="34" cy="308" rx="94" ry="72" fill="#6a8a54" opacity="0.5"/>
      <ellipse cx="0" cy="596" rx="140" ry="22" fill="#33452b" opacity="0.4"/>
    </g>
    <!-- Mid-distance pines -->
    <g fill="#3a5136">
      <g transform="translate(430 500) scale(0.75)">
        <rect x="-6" y="-30" width="12" height="46"/>
        <path d="M0 -170 L32 -104 L14 -104 L42 -46 L18 -46 L50 -6 L-50 -6 L-18 -46 L-42 -46 L-14 -104 L-32 -104Z"/>
      </g>
      <g transform="translate(500 512) scale(0.6)">
        <rect x="-6" y="-30" width="12" height="46"/>
        <path d="M0 -170 L32 -104 L14 -104 L42 -46 L18 -46 L50 -6 L-50 -6 L-18 -46 L-42 -46 L-14 -104 L-32 -104Z"/>
      </g>
      <g transform="translate(860 506) scale(0.68)">
        <rect x="-6" y="-30" width="12" height="46"/>
        <path d="M0 -170 L32 -104 L14 -104 L42 -46 L18 -46 L50 -6 L-50 -6 L-18 -46 L-42 -46 L-14 -104 L-32 -104Z"/>
      </g>
    </g>
  </g>

  <!-- Herbaceous border -->
  <g>
    <ellipse cx="330" cy="720" rx="140" ry="40" fill="#4a6140"/>
    <ellipse cx="880" cy="706" rx="130" ry="36" fill="#4a6140"/>
    <g fill="#8a6f92" opacity="0.8">
      <circle cx="280" cy="700" r="9"/><circle cx="316" cy="690" r="8"/><circle cx="352" cy="702" r="9"/>
      <circle cx="392" cy="694" r="8"/><circle cx="846" cy="688" r="8"/><circle cx="884" cy="694" r="9"/>
      <circle cx="922" cy="686" r="8"/>
    </g>
    <g fill="#e6dcc4" opacity="0.85">
      <circle cx="300" cy="712" r="7"/><circle cx="370" cy="716" r="7"/><circle cx="866" cy="706" r="7"/>
      <circle cx="906" cy="710" r="7"/>
    </g>
    <g fill="#c26b6b" opacity="0.7">
      <circle cx="336" cy="676" r="7"/><circle cx="410" cy="708" r="7"/><circle cx="826" cy="704" r="6"/>
    </g>
  </g>

  <!-- Wrought-iron bench under the tree -->
  <g transform="translate(600 760)">
    <rect x="-90" y="0" width="180" height="12" rx="3" fill="#3e4438"/>
    <rect x="-90" y="-52" width="180" height="10" rx="3" fill="#3e4438"/>
    <rect x="-90" y="-34" width="180" height="8" rx="3" fill="#3e4438" opacity="0.85"/>
    <rect x="-84" y="12" width="10" height="40" fill="#3e4438"/>
    <rect x="74" y="12" width="10" height="40" fill="#3e4438"/>
    <rect x="-92" y="-56" width="8" height="70" fill="#3e4438"/>
    <rect x="84" y="-56" width="8" height="70" fill="#3e4438"/>
    <ellipse cx="0" cy="56" rx="110" ry="14" fill="#33452b" opacity="0.35"/>
  </g>
</svg>
