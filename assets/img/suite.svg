<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A four-poster bedroom with morning light through a sash window">
  <defs>
    <linearGradient id="sWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dfcd"/><stop offset="100%" stop-color="#d2c6ae"/>
    </linearGradient>
    <linearGradient id="sFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a48"/><stop offset="100%" stop-color="#6a4f34"/>
    </linearGradient>
    <linearGradient id="sLight" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#fff4d9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff4d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sBed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfaf3"/><stop offset="100%" stop-color="#e6dece"/>
    </linearGradient>
    <linearGradient id="sWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0e2"/><stop offset="60%" stop-color="#e8e2cc"/><stop offset="100%" stop-color="#a8b598"/>
    </linearGradient>
    <filter id="sBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1200" height="900" fill="url(#sWall)"/>

  <!-- Panelling / wallpaper stripe -->
  <g opacity="0.28" fill="#b9a98c">
    <rect x="0" y="0" width="6" height="900"/><rect x="86" y="0" width="6" height="900"/>
    <rect x="172" y="0" width="6" height="900"/><rect x="258" y="0" width="6" height="900"/>
    <rect x="344" y="0" width="6" height="900"/><rect x="430" y="0" width="6" height="900"/>
    <rect x="946" y="0" width="6" height="900"/><rect x="1032" y="0" width="6" height="900"/>
    <rect x="1118" y="0" width="6" height="900"/>
  </g>
  <rect x="0" y="0" width="1200" height="34" fill="#efe8d8"/>
  <rect x="0" y="34" width="1200" height="8" fill="#c4b596"/>

  <!-- Window with the glen beyond -->
  <g transform="translate(690 120)">
    <rect x="-16" y="-16" width="332" height="452" fill="#f2ecdc"/>
    <rect x="0" y="0" width="300" height="420" fill="url(#sWin)"/>
    <g fill="#7f8f74" opacity="0.75">
      <path d="M0 300 q52 -46 108 -14 q60 -50 122 -10 q40 -26 70 -6 L300 420 L0 420Z"/>
    </g>
    <g fill="#5f7059" opacity="0.6"><path d="M0 356 q70 -30 140 -6 q80 -26 160 -4 L300 420 L0 420Z"/></g>
    <g stroke="#f6f1e3" stroke-width="9" fill="none">
      <path d="M150 0 V420 M0 140 H300 M0 280 H300"/>
      <rect x="0" y="0" width="300" height="420"/>
    </g>
    <!-- Curtains -->
    <path d="M-16 -16 h84 q-30 240 -6 452 h-78 Z" fill="#4a5f4c"/>
    <path d="M332 -16 h-84 q30 240 6 452 h78 Z" fill="#4a5f4c"/>
    <path d="M52 -16 q-18 230 -2 452 h-14 q-22 -224 -2 -452Z" fill="#3d5040" opacity="0.7"/>
    <path d="M264 -16 q18 230 2 452 h14 q22 -224 2 -452Z" fill="#3d5040" opacity="0.7"/>
  </g>

  <!-- Light spilling into the room -->
  <path d="M690 120 L1006 120 L1200 760 L420 760 Z" fill="url(#sLight)" opacity="0.55" filter="url(#sBlur)"/>

  <!-- Floor -->
  <rect x="0" y="700" width="1200" height="200" fill="url(#sFloor)"/>
  <g opacity="0.25" stroke="#4c3823" stroke-width="2">
    <path d="M0 730 H1200 M0 768 H1200 M0 812 H1200 M0 860 H1200"/>
  </g>
  <!-- Rug -->
  <g>
    <rect x="150" y="742" width="900" height="158" fill="#6b4a4a" opacity="0.85"/>
    <rect x="176" y="758" width="848" height="126" fill="none" stroke="#c2a06a" stroke-width="3" opacity="0.8"/>
    <rect x="206" y="776" width="788" height="90" fill="none" stroke="#c2a06a" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Four-poster bed -->
  <g transform="translate(150 210)">
    <!-- Posts and canopy -->
    <g fill="#4a3626">
      <rect x="0" y="0" width="20" height="530"/>
      <rect x="440" y="0" width="20" height="530"/>
      <rect x="-10" y="0" width="480" height="22"/>
      <rect x="-16" y="-14" width="492" height="16" rx="3"/>
    </g>
    <!-- Canopy drapes -->
    <path d="M-6 22 h74 q-16 130 -4 220 h-70 Z" fill="#59503f" opacity="0.9"/>
    <path d="M466 22 h-74 q16 130 4 220 h70 Z" fill="#59503f" opacity="0.9"/>
    <!-- Headboard -->
    <path d="M28 130 h404 v230 h-404 Z" fill="#5b4230"/>
    <path d="M52 154 h356 v182 h-356 Z" fill="none" stroke="#7d5f45" stroke-width="4"/>
    <!-- Mattress and linens -->
    <rect x="8" y="352" width="444" height="46" fill="#f6f1e6"/>
    <rect x="8" y="398" width="444" height="118" fill="url(#sBed)"/>
    <rect x="8" y="398" width="444" height="18" fill="#fffdf7"/>
    <!-- Tartan throw across the foot -->
    <rect x="8" y="452" width="444" height="52" fill="#7a3a3a" opacity="0.9"/>
    <g opacity="0.5" stroke="#2f4030" stroke-width="4">
      <path d="M46 452 V504 M112 452 V504 M178 452 V504 M244 452 V504 M310 452 V504 M376 452 V504"/>
      <path d="M8 470 H452 M8 490 H452"/>
    </g>
    <g opacity="0.35" stroke="#d8b878" stroke-width="1.5">
      <path d="M78 452 V504 M144 452 V504 M210 452 V504 M276 452 V504 M342 452 V504 M408 452 V504"/>
      <path d="M8 462 H452 M8 480 H452"/>
    </g>
    <!-- Pillows -->
    <g fill="#fffdf6">
      <rect x="40" y="300" width="170" height="66" rx="14"/>
      <rect x="250" y="300" width="170" height="66" rx="14"/>
      <rect x="72" y="262" width="140" height="52" rx="12" opacity="0.9"/>
      <rect x="248" y="262" width="140" height="52" rx="12" opacity="0.9"/>
    </g>
    <!-- Base -->
    <rect x="8" y="516" width="444" height="18" fill="#4a3626"/>
  </g>

  <!-- Bedside table and lamp -->
  <g transform="translate(650 560)">
    <rect x="0" y="60" width="120" height="12" fill="#5b4230"/>
    <rect x="8" y="72" width="104" height="72" fill="#6b4f38"/>
    <rect x="20" y="88" width="80" height="22" fill="#54402d"/>
    <circle cx="60" cy="126" r="4" fill="#b08d57"/>
    <path d="M32 60 h56 l10 -46 h-76 Z" fill="#e5d3ac"/>
    <rect x="56" y="14" width="8" height="-4" fill="#8a6a48"/>
    <ellipse cx="60" cy="40" rx="90" ry="60" fill="#ffe9bd" opacity="0.28" filter="url(#sBlur)"/>
  </g>

  <!-- Armchair by the window -->
  <g transform="translate(1010 560)">
    <path d="M0 200 h150 v-96 a34 34 0 0 0 -34 -34 h-82 a34 34 0 0 0 -34 34 Z" fill="#4a5f4c"/>
    <rect x="14" y="120" width="122" height="46" rx="10" fill="#5d7360"/>
    <rect x="-8" y="96" width="26" height="92" rx="10" fill="#3f5142"/>
    <rect x="132" y="96" width="26" height="92" rx="10" fill="#3f5142"/>
  </g>

  <!-- Framed pictures -->
  <g transform="translate(150 96)" opacity="0.9">
    <rect x="0" y="0" width="0" height="0"/>
  </g>
</svg>
